name: base watch

# Who owns a red main (ludics-lite#73). Nothing here read main's own verdict between waves: main
# was red from 8fd8778 for a day — a macOS fixture case, `test_runner_reaps_a_statusless_case` —
# and it stayed nameless until a PR tripped over it and a coordinator filed the red from that PR's
# evidence, after which the fix had to be merged into two in-flight branches before their gates
# could read green. Every worker's session starts by branching off main, so the cost of an
# unowned red is paid by everyone who starts work under it, in "is this my change?" time.
#
# So the same read a worker does at session start (`pr-review.sh base`) runs when main's skill
# scripts finishes, with a daily backstop, and gives a red an owner: one issue naming the workflow,
# the job that failed and the commit the red starts at. A merger does not wait for trailing CI,
# so waiting until morning would leave its red unowned (ludics-lite#126). On demand as well, for
# the same reason the contract check is: to be able to ask.
#
# This workflow never appears in its own report: `base` folds `event=push` runs only, and nothing
# here triggers on push. Giving it a push trigger would make a red base-watch file an issue about
# base-watch.

on:
  workflow_run:
    workflows: [skill scripts]
    types: [completed]
    branches: [main]
  schedule:
    # Away from api-contract.yml's 05:23 UTC: both read this repository's Actions API, and two
    # scheduled runs in the same minute would share a rate-limit window for no reason.
    - cron: '47 6 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/base-watch.yml
      - .github/workflows/base-watch-reusable.yml
      - ship-pr/scripts/pr-review.sh # the command this runs: a change to it is a change to this

permissions:
  contents: read

jobs:
  # The read and the report live in base-watch-reusable.yml, which other repositories call too
  # (lukstafi/ludics-lite#349). A pull request here runs its own copy of both, through the local path.
  watch:
    uses: ./.github/workflows/base-watch-reusable.yml
    with:
      branch: main
    permissions:
      contents: read
      actions: read
      issues: write
